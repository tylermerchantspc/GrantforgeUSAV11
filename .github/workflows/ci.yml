name: GrantForgeUSA CI

on:
  pull_request:
  push:
    branches:
      - main
      - soft-launch-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/grantforge-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/grantforge-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run integration tests
        run: npm run test:integration
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    env:
      APP_MODE: development
      LIVE_GRANTS_ENABLED: "false"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests
        run: pytest backend/tests/test_v11_server.py backend/tests/test_runtime_config.py
