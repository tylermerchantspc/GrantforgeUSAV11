name: One-time final sector alignment
on:
  push:
    paths:
      - '.github/workflows/one-time-final-sector-alignment.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final alignment patch
        run: python scripts/one_time_final_sector_alignment.py
      - name: Validate Python syntax
        run: python -m py_compile backend/v11_server.py backend/tests/test_v11_server.py
      - name: Commit application changes
        run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/tests/test_v11_server.py
          git commit -m "Align agriculture routing and checkout policy metadata"
          git push origin HEAD:main
