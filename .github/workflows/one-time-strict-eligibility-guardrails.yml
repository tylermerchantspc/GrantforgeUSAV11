name: One-time strict eligibility guardrails
on:
  push:
    paths:
      - '.github/workflows/one-time-strict-eligibility-guardrails.yml'
permissions:
  contents: write
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guardrail patch
        run: python scripts/one_time_strict_eligibility_guardrails.py
      - name: Validate Python syntax
        run: python -m py_compile backend/v11_server.py backend/grantsgov_live.py backend/tests/test_v11_server.py
      - name: Commit application changes
        run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/grantsgov_live.py backend/tests/test_v11_server.py backend/tests/test_grantsgov_live.py
          git commit -m "Harden free-text eligibility and exclude student-applicant grants"
          git push origin HEAD:main
