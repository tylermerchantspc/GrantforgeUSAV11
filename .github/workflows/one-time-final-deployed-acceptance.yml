name: One-time final deployed acceptance
on:
  push:
    paths:
      - '.github/workflows/one-time-final-deployed-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise deployed GrantForgeUSA release candidate
        env:
          BASE_URL: https://grantforgeusa-v11-backend.onrender.com
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = os.environ['BASE_URL'].rstrip('/')
          def get(path):
              with urlopen(base + path, timeout=30) as r:
                  return r.status, json.loads(r.read().decode())
          def post(path, payload):
              req = Request(base + path, data=json.dumps(payload).encode(), headers={'Content-Type':'application/json'}, method='POST')
              try:
                  with urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read().decode())
              except HTTPError as exc:
                  raw = exc.read().decode(errors='replace')
                  try: data = json.loads(raw)
                  except Exception: data = {'raw': raw}
                  return exc.code, data

          status, health = get('/get/health')
          print('HEALTH', status, health)
          assert status == 200 and health.get('ok') is True
          assert str(health.get('mode','')).lower() == 'test'

          positive = {
              'organization':'Prairie State University', 'category':'Public College / University', 'state':'Minnesota',
              'annualBudget':50000000, 'projectTitle':'Rural Agricultural STEM Career Pathways', 'amountRequested':150000,
              'timeline':'12 months', 'audience':'Rural K-14 students in southern Minnesota interested in agricultural science and engineering careers',
              'keywords':'STEM, agriculture, rural youth, agricultural science, engineering, careers, experiential learning',
              'need':'Rural K-14 students have limited access to hands-on agricultural science, engineering, mentoring, and career pathway experiences.',
              'notes':'The applicant is a public, state-controlled, accredited university. It plans a single-function education and extension project in food and agricultural sciences led by faculty and extension educators with secondary and community-college partners.'
          }
          energy = {
              'organization':'North Star Fabrication LLC', 'category':'Small Business', 'state':'Minnesota', 'annualBudget':380000,
              'projectTitle':'Rural Manufacturing Energy Upgrade', 'amountRequested':90000, 'timeline':'12 months',
              'audience':'Manufacturing employees and customers', 'keywords':'small business, rural energy, energy efficiency, manufacturing',
              'need':'Reduce energy use in a rural manufacturing operation by replacing inefficient production equipment.',
              'notes':'Capital equipment efficiency and operational improvements.'
          }

          # Render deploys asynchronously. Use the two known stale/bad records as a deployment sentinel.
          energy_out = {}
          for attempt in range(12):
              st, energy_out = post('/questionnaire', energy)
              assert st == 200 and energy_out.get('ok') is True, (st, energy_out)
              ids = {str(r.get('opp_id')) for r in (energy_out.get('results') or [])}
              print('DEPLOY SENTINEL', attempt + 1, [(r.get('opp_id'), r.get('title')) for r in (energy_out.get('results') or [])])
              if '310029' not in ids and '363174' not in ids:
                  break
              time.sleep(15)
          ids = {str(r.get('opp_id')) for r in (energy_out.get('results') or [])}
          assert '310029' not in ids, 'Expired 2019 REAP record still surfaced'
          assert '363174' not in ids, 'DOE Notice of Intent still surfaced'
          assert 'accelerating scale-up and pre-piloting of emerging chemical technologies' not in json.dumps(energy_out).lower()

          # Positive live Grants.gov path.
          st, out = post('/questionnaire', positive)
          assert st == 200 and out.get('ok') is True, (st, out)
          results = out.get('results') or []
          print('POSITIVE', [(r.get('opp_id'), r.get('title'), r.get('fit')) for r in results])
          assert results
          blob = json.dumps(results).lower()
          assert 'air force fiscal year 2027 young investigator' not in blob
          assert 'air force basic research sciences conference' not in blob
          target = next((r for r in results if str(r.get('opp_id')) == '361169'), results[0])
          assert target.get('purchasable') is True
          assert target.get('fit') in ('Strong Match','Possible Match')
          assert target.get('source') == 'Grants.gov live API'
          assert float(target.get('min_amount') or 0) <= 150000 <= float(target.get('max_amount') or 10**12)
          assert 'agricultur' in ((target.get('sector') or '') + ' ' + (target.get('summary') or '')).lower()

          selected = dict(positive); selected['grant'] = target
          st, preview = post('/preview', selected)
          print('PREVIEW STATUS', st)
          assert st == 200 and preview.get('ok') is True, (st, preview)
          lower = (preview.get('summary') or '').lower()
          assert 'prairie state university' in lower
          assert 'official notice' in lower
          assert 'cost sharing' in lower or 'matching' in lower
          for invented in ('20% engagement','70% proficiency','90% milestone'):
              assert invented not in lower

          # Stripe test session only; no charge is completed.
          st, checkout = post('/create-checkout-session', selected)
          print('CHECKOUT STATUS', st)
          assert st == 200 and checkout.get('ok') is True, (st, checkout)
          assert str(checkout.get('url','')).startswith('https://checkout.stripe.com/')
          assert checkout.get('checkoutReference')

          # Known historical false-positive cases must remain clean.
          negatives = [
              ('MEMORIAL', {'organization':'Martin County Veterans','category':'501(c)(3) Nonprofit','state':'Minnesota','annualBudget':90000,'projectTitle':'Purple Heart Statue','amountRequested':50000,'timeline':'May 2027','audience':'Local veterans and travelers to Martin County','keywords':'memorial, veterans, park','need':'Install a memorial at the county veterans park recognizing the cost of war.','notes':'Local veterans organizations may assist.'}),
              ('ROBOTICS', {'organization':'Prairie Ridge Middle School','category':'K-12 School / District / Educator','state':'Minnesota','annualBudget':120000,'projectTitle':'Rural Robotics Discovery Lab','amountRequested':18000,'timeline':'2026-2027 school year','audience':'Middle school students','keywords':'STEM, robotics, classroom technology, equipment','need':'Expand hands-on robotics and engineering learning.','notes':'School-based instructional project.'}),
          ]
          forbidden = ('advancing oil and natural gas production','advanced nuclear energy licensing','radioactive materials transportation')
          for label, payload in negatives:
              st, result = post('/questionnaire', payload)
              assert st == 200 and result.get('ok') is True, (label, st, result)
              text = json.dumps(result).lower()
              print(label, [(r.get('title'), r.get('fit')) for r in (result.get('results') or [])])
              for phrase in forbidden:
                  assert phrase not in text, (label, phrase, result)

          print('FINAL_DEPLOYED_ACCEPTANCE_PASS')
          PY
