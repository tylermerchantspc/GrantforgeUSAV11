name: Test state grants A1

on:
  push:
    branches:
      - feature/state-grants-a1
    paths:
      - 'backend/state_grants_live.py'
      - 'backend/tests/test_state_grants_live.py'
      - '.github/workflows/test-state-grants-a1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      LIVE_GRANTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Run state adapter tests and backend regression suite
        run: |
          pytest -q backend/tests/test_state_grants_live.py
          pytest -q backend/tests
      - name: Live smoke and adversarial source checks
        env:
          LIVE_GRANTS_ENABLED: 'true'
        run: |
          python - <<'PY'
          import re
          from backend.state_grants_live import search_state_grants, fetch_state_grant
          probes = {
              'CA': 'water infrastructure community',
              'IL': 'education community services',
              'IA': 'energy community development',
          }
          collected = {}
          for state, query in probes.items():
              rows = search_state_grants(state, query)
              collected[state] = rows
              print(state, 'RESULTS', len(rows))
              for row in rows[:5]:
                  print(state, row.get('title'), row.get('deadline'), row.get('official_url'))
              assert isinstance(rows, list)
              for row in rows:
                  assert row.get('title')
                  assert row.get('official_url', '').startswith('https://')
                  assert row.get('level') == 'State'
                  assert row.get('state') == state

          # Loan-only records must never enter the state grant candidate set.
          for row in collected['IA']:
              title = (row.get('title') or '').lower()
              assert not (re.search(r'\bloans?\b', title) and not re.search(r'\bgrants?\b', title)), title

          # Re-fetch one live record from each state by normalized ID. This is the
          # server-side behavior preview/checkout will use instead of trusting browser data.
          for state, rows in collected.items():
              if not rows:
                  continue
              selected = rows[0]
              live = fetch_state_grant(state, selected['opp_id'], refresh=True)
              assert live and live.get('opp_id') == selected.get('opp_id')
              print(state, 'REFETCH_OK', live.get('opp_id'), live.get('title'))
          PY
