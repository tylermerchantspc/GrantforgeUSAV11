name: One-time R&D negation guardrail
on:
  push:
    paths:
      - '.github/workflows/one-time-rd-negation-guardrail.yml'
permissions:
  contents: write
jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R&D negation patch
        run: python scripts/one_time_rd_negation_guardrail.py
      - name: Validate backend syntax
        run: python -m py_compile backend/v11_server.py backend/tests/test_v11_server.py
      - name: Commit application changes
        run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/tests/test_v11_server.py
          git commit -m "Handle negative R&D intent conservatively"
          git push origin HEAD:main
