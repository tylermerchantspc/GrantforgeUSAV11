name: One-time final compliance hardening
on:
  push:
    paths:
      - '.github/workflows/one-time-final-compliance-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final compliance patch
        run: python scripts/one_time_final_compliance_hardening.py
      - name: Validate Python syntax
        run: python -m py_compile backend/v11_server.py backend/grantsgov_live.py backend/tests/test_v11_server.py
      - name: Commit application changes
        run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/grantsgov_live.py backend/tests/test_v11_server.py
          git commit -m "Tighten eligibility, geography, and cost-share guardrails"
          git push origin HEAD:main
