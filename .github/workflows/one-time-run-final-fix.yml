name: One-time run final fix
on:
  push:
    paths:
      - '.github/workflows/one-time-run-final-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/one_time_final_source_test_fix.py
      - run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/tests/test_v11_server.py
          git commit -m "Decouple live grants from payment mode and stabilize tests"
          git push origin HEAD:main
