name: One-time live Grants.gov wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-live-grants-wiring.yml'

permissions:
  contents: write

jobs:
  wire-live-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire official live opportunity search into production shortlist
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/v11_server.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from runtime_config import load_runtime_settings\n'
          import_line = 'from backend.grantsgov_live import search_live_grants\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('runtime_config import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''    grants = _read_json(GRANTS_PATH) or []\n    category = payload.get("category") or payload.get("who") or ""'''
          new = '''    grants = _read_json(GRANTS_PATH) or []\n    if APP_MODE == "production" and os.getenv("LIVE_GRANTS_ENABLED", "true").lower() != "false":\n        live_query = (payload.get("keywords") or payload.get("projectTitle") or "").strip()\n        live_grants = search_live_grants(live_query) if live_query else []\n        if live_grants:\n            grants = live_grants\n\n    category = payload.get("category") or payload.get("who") or ""'''
          if old not in text:
              raise SystemExit('shortlist grant source anchor missing')
          text = text.replace(old, new, 1)

          old_doc = '''    Turn intake into 0–3 strong matches from backend/data/grants.json.\n    Data quality lives in grants.json; logic lives here.'''
          new_doc = '''    Turn intake into 0–3 ranked federal opportunities.\n    Production queries the live Grants.gov API first and uses the local dataset only as a resilient fallback.'''
          if old_doc in text:
              text = text.replace(old_doc, new_doc, 1)

          row_anchor = '''                    "summary": gr.get("summary", ""),\n                    "level": "Federal",'''
          row_new = '''                    "summary": gr.get("summary", ""),\n                    "source": gr.get("source", "GrantForgeUSA verified fallback dataset"),\n                    "level": "Federal",'''
          if row_anchor not in text:
              raise SystemExit('shortlist result shape anchor missing')
          text = text.replace(row_anchor, row_new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify syntax and wiring
        run: |
          python -m py_compile backend/grantsgov_live.py backend/v11_server.py
          grep -q 'search_live_grants' backend/v11_server.py
          grep -q 'LIVE_GRANTS_ENABLED' backend/v11_server.py
          grep -q 'Grants.gov live API' backend/grantsgov_live.py
      - name: Commit live search wiring
        run: |
          git config user.name 'GrantForgeUSA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/v11_server.py
          git commit -m 'Use live Grants.gov search for production matching'
          git push origin main
