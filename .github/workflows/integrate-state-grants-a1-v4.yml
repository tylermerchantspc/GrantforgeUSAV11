name: Integrate state grants A1 v4

on:
  push:
    branches:
      - feature/state-grants-a1
    paths:
      - '.github/workflows/integrate-state-grants-a1-v4.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      LIVE_GRANTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/state-grants-a1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply verified integration and test-fixture revalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/integrate-state-grants-a1.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Add integration tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          patch = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(patch, 'state-integration-patch', 'exec'), {})

          p = Path('backend/v11_server.py')
          s = p.read_text()
          old = '    "aging": ("aging", "geriatric", "alzheimer", "older adults"),\n'
          new = '    "aging": ("aging research", "biology of aging", "age-related disease", "geriatric", "alzheimer"),\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          test_start_marker = "          cat > backend/tests/test_state_server_integration.py <<'PY'\n"
          test_end_marker = "\n          PY\n\n      - name: Run tests before commit"
          ts = workflow.index(test_start_marker) + len(test_start_marker)
          te = workflow.index(test_end_marker, ts)
          test_lines = workflow[ts:te].splitlines()
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in test_lines)
          tests = tests.replace(
              "for patch in ({'deadline':''},{'eligibility_text':''},{'max_amount':0}",
              "for patch in ({'deadline':'','close_date':''},{'eligibility_text':''},{'max_amount':0}",
              1,
          )
          tests += '''\n\ndef test_aging_infrastructure_language_does_not_trigger_geriatric_strict_group():\n    assert "aging" not in srv._purpose_groups("Replace aging drinking water mains in a rural community")\n\ndef test_explicit_aging_research_still_triggers_aging_group():\n    assert "aging" in srv._purpose_groups("biology of aging and geriatric research")\n'''
          Path('backend/tests/test_state_server_integration.py').write_text(tests)

          # Legacy paid-flow tests used a browser-side test fixture that intentionally
          # was not authoritative. Preserve the new production re-fetch boundary by
          # teaching the fixture to behave like a verified Grants.gov selection.
          t = Path('backend/tests/test_v11_server.py')
          x = t.read_text()
          old_helper = '''def _mock_purchase_ready_shortlist(monkeypatch, payload):\n    grant = _purchase_ready_grant(payload)\n    monkeypatch.setattr(srv, "shortlist", lambda data: ([dict(grant)], True))\n    return grant\n'''
          new_helper = '''def _mock_purchase_ready_shortlist(monkeypatch, payload):\n    grant = _purchase_ready_grant(payload)\n    grant["source"] = "Grants.gov live data"\n    grant["opp_id"] = "TEST-2027-001"\n    grant["opportunity_id"] = "TEST-2027-001"\n    monkeypatch.setattr(srv, "shortlist", lambda data, pinned_grant=None: ([dict(pinned_grant or grant)], True))\n    monkeypatch.setattr(srv, "fetch_live_grant", lambda identifier: dict(grant) if str(identifier) == "TEST-2027-001" else {})\n    return grant\n'''
          assert old_helper in x
          t.write_text(x.replace(old_helper, new_helper, 1))
          PY
      - name: Run complete branch regressions
        run: |
          pytest -q backend/tests/test_state_grants_live.py backend/tests/test_state_server_integration.py
          pytest -q backend/tests
      - name: Commit only after green tests
        run: |
          git config user.name "GrantForgeUSA QA"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/tests/test_state_server_integration.py backend/tests/test_v11_server.py
          git commit -m "Integrate state grants with authoritative selection gates"
          git push origin HEAD:feature/state-grants-a1
