name: One-time public flow smoke test

on:
  push:
    paths:
      - '.github/workflows/one-time-public-flow-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live Grants.gov adapter against official API
        run: |
          python - <<'PY'
          from backend.grantsgov_live import search_live_grants
          rows = search_live_grants('health', max_details=8)
          if not rows:
              raise SystemExit('Live Grants.gov adapter returned no opportunities')
          if not any(r.get('source') == 'Grants.gov live API' for r in rows):
              raise SystemExit('Live source marker missing')
          if not all(str(r.get('program_url', '')).startswith('https://www.grants.gov/') for r in rows):
              raise SystemExit('Non-Grants.gov official link returned')
          print(f'official-live-opportunities={len(rows)}')
          print('sample-title=' + str(rows[0].get('title', ''))[:160])
          print('sample-deadline=' + str(rows[0].get('deadline', '')))
          PY

      - name: Wait for deployed backend health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://grantforgeusa-v11-backend.onrender.com/get/health > health.json
          python - <<'PY'
          import json
          data = json.load(open('health.json', encoding='utf-8'))
          if not isinstance(data, dict):
              raise SystemExit('Health response is not JSON object')
          print(json.dumps(data, sort_keys=True))
          PY

      - name: Exercise deployed intake to match to preview path
        run: |
          cat > intake.json <<'JSON'
          {
            "organization": "GrantForgeUSA Public Flow Smoke Test",
            "contactName": "Test User",
            "contactEmail": "test@example.com",
            "zip": "56031",
            "category": "501c3 Nonprofit",
            "annualBudget": 350000,
            "amountRequested": 100000,
            "projectTitle": "Rural community health access project",
            "keywords": "health, rural, community",
            "timeline": "12 months",
            "audience": "rural residents and families",
            "need": "Improve community access to health services and outreach.",
            "notes": "Smoke test only.",
            "includeExpired": false
          }
          JSON

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @intake.json \
            https://grantforgeusa-v11-backend.onrender.com/questionnaire > matches.json

          python - <<'PY'
          import json
          from datetime import date, datetime

          data = json.load(open('matches.json', encoding='utf-8'))
          if not data.get('ok'):
              raise SystemExit('Questionnaire response not ok: ' + str(data))
          rows = data.get('results') or []
          if not rows:
              raise SystemExit('Questionnaire returned zero matches')
          today = date.today()
          for row in rows:
              deadline = str(row.get('deadline') or '')
              if deadline and deadline != 'TBA':
                  try:
                      parsed = datetime.strptime(deadline[:10], '%Y-%m-%d').date()
                  except ValueError:
                      parsed = None
                  if parsed and parsed < today:
                      raise SystemExit('Expired opportunity returned: ' + deadline)
              if not str(row.get('program_url') or '').startswith('https://www.grants.gov/'):
                  raise SystemExit('Result missing official Grants.gov link')
          print(f'deployed-matches={len(rows)}')
          print('first-fit=' + str(rows[0].get('fit')))
          print('first-score=' + str(rows[0].get('score')))
          print('first-source=' + str(rows[0].get('source')))

          payload = json.load(open('intake.json', encoding='utf-8'))
          payload['grant'] = rows[0]
          json.dump(payload, open('preview-request.json', 'w', encoding='utf-8'))
          PY

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @preview-request.json \
            https://grantforgeusa-v11-backend.onrender.com/preview > preview.json

          python - <<'PY'
          import json
          data = json.load(open('preview.json', encoding='utf-8'))
          if not data.get('ok'):
              raise SystemExit('Preview response not ok: ' + str(data))
          summary = str(data.get('summary') or '').strip()
          if len(summary) < 100:
              raise SystemExit('Preview is unexpectedly empty/short')
          print(f'preview-characters={len(summary)}')
          PY
