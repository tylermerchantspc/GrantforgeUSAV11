name: One-time final customer UX polish
on:
  push:
    paths:
      - '.github/workflows/one-time-final-ux-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve no-match guidance and clarify teacher eligibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/grantforge-frontend/src/App.jsx')
          s = p.read_text()
          s = s.replace(
              '    } else {\n      setNotice("No matching federal opportunities were returned for this intake. Try refining the project keywords or funding request.");\n    }\n',
              '    } else if (!response.notice) {\n      setNotice("No purchase-ready federal opportunity matched this intake. Try refining the project description, keywords, applicant type, state, or funding request.");\n    }\n'
          )
          needle = '''                  </select>\n                </label>\n                <label>\n                  Contact name <em>*</em>\n'''
          replacement = '''                  </select>\n                  {form.category === "Teacher (Classroom)" && (\n                    <small className="field-guidance">Many federal opportunities require the school or district - not an individual teacher - to be the eligible applicant. Enter the school or district information where applicable.</small>\n                  )}\n                </label>\n                <label>\n                  Contact name <em>*</em>\n'''
          if needle not in s:
              raise SystemExit('Applicant type insertion point not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          css = Path('frontend/grantforge-frontend/src/flow.css')
          c = css.read_text()
          if '.field-guidance {' not in c:
              c += '''\n.field-guidance {\n  display: block;\n  margin-top: 0.45rem;\n  font-size: 0.82rem;\n  line-height: 1.45;\n  color: #526277;\n}\n'''
          css.write_text(c)
          PY
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/grantforge-frontend/src/App.jsx frontend/grantforge-frontend/src/flow.css
          git commit -m "Polish no-match and teacher eligibility guidance"
          git push origin HEAD:main
