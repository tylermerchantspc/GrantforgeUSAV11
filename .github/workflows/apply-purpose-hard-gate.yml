name: Apply purpose relevance hard gate

on:
  push:
    paths:
      - '.github/workflows/apply-purpose-hard-gate.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply purpose hard gate
        run: python scripts/apply_purpose_hard_gate.py
      - name: Install backend dependencies
        run: python -m pip install -q -r backend/requirements.txt
      - name: Run backend regression tests
        run: pytest -q backend/tests
      - name: Commit tested matcher patch
        run: |
          git config user.name "GrantForgeUSA QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/grantsgov_live.py backend/tests/test_purpose_relevance.py
          git commit -m "Harden grant program-purpose relevance gate"
          git push
