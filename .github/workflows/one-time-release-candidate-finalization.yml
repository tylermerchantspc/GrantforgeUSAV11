name: One-time GrantForgeUSA release candidate
on:
  push:
    paths:
      - '.github/workflows/one-time-release-candidate-finalization.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release-candidate patch
        run: |
          python scripts/release_candidate_patch.py
          python -m py_compile backend/v11_server.py backend/grantsgov_live.py
      - name: Commit application changes
        run: |
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/grantforge-frontend/src/App.jsx frontend/grantforge-frontend/tests/integration.test.mjs backend/v11_server.py backend/grantsgov_live.py backend/tests/test_v11_server.py README.md
          git commit -m "Finalize flat pricing, applicant coverage, narrative, and PDF quality"
          git push origin HEAD:main
