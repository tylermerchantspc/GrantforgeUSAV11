name: Apply purpose relevance hard gate v2

on:
  push:
    paths:
      - '.github/workflows/apply-purpose-hard-gate-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    env:
      APP_MODE: development
      LIVE_GRANTS_ENABLED: "false"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply second-stage purpose hardening
        run: python scripts/apply_purpose_hard_gate_v2.py
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend regression tests
        run: pytest -q backend/tests
      - name: Commit tested second-stage matcher patch
        run: |
          git config user.name "GrantForgeUSA QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/tests/test_purpose_relevance.py
          git commit -m "Tighten grant purpose specificity matching"
          git push
