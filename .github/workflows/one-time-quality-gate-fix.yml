name: One-time GrantForge matching quality fixes
on:
  push:
    paths:
      - '.github/workflows/one-time-quality-gate-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final matching fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/v11_server.py')
          s = p.read_text()

          s = s.replace('    payload.pop("state", None)\n    payload.pop("eligible_state", None)\n\n', '')
          s = s.replace('            if _safe_float(gr.get("max_amount"), 0) > 2_000_000:\n                continue\n', '')

          start = s.index('def fraud_check(category: str, amount: float) -> Dict[str, Any]:')
          end = s.index('\n\nUS_STATE_NAMES =', start)
          s = s[:start] + '''def fraud_check(category: str, amount: float) -> Dict[str, Any]:\n    """Basic transaction sanity checks; grant-specific limits belong to the official notice."""\n    if amount <= 0:\n        return {"ok": False, "msg": "Requested amount must be greater than 0."}\n    return {"ok": True, "msg": ""}\n''' + s[end:]

          s = s.replace(
              '        or "search-results-detail/" in lowered\n',
              ''
          )
          s = s.replace(
              '        lowered.startswith("https://www.grants.gov/opportunity/details/")\n        or lowered.startswith("https://www.grants.gov/search-results?query=")\n',
              '        lowered.startswith("https://www.grants.gov/opportunity/details/")\n        or lowered.startswith("https://www.grants.gov/search-results-detail/")\n        or lowered.startswith("https://www.grants.gov/search-results?query=")\n'
          )

          needle = '    elig = " ".join([str(e).lower() for e in gr.get("eligible_types", [])])\n'
          s = s.replace(needle, needle + '    if "unrestricted" in elig:\n        return True\n')

          old = '''    fit = (\n        "Strong Match"\n        if score >= 130\n        else "Possible Match" if score >= 95 else "Low Match"\n    )\n    if kws and overlap:\n        score += min(len(set(overlap)), 4) * 2\n    return {"score": score, "fit": fit, "fit_notes": " ".join(fit_notes)}\n'''
          new = '''    if kws and overlap:\n        score += min(len(set(overlap)), 4) * 2\n    fit = (\n        "Strong Match"\n        if score >= 130\n        else "Possible Match" if score >= 95 else "Low Match"\n    )\n    return {"score": score, "fit": fit, "fit_notes": " ".join(fit_notes)}\n'''
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('backend/grantsgov_live.py')
          s = p.read_text()
          marker = '\ndef _detail_to_grant(hit: Dict[str, Any], detail: Dict[str, Any]) -> Dict[str, Any]:\n'
          helper = '''\ndef _canonical_sector(activity_codes: Iterable[str]) -> str:\n    code_set = {str(code or "").strip() for code in activity_codes}\n    for sector, codes in SECTOR_FUNDING_CODES.items():\n        if code_set.intersection(codes):\n            return sector\n    return ""\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          s = s.replace(
              '        "sector": " / ".join(activity_categories[:3]),\n',
              '        "sector": _canonical_sector(activity_codes),\n        "sector_labels": activity_categories[:3],\n'
          )
          p.write_text(s)

          p = Path('frontend/grantforge-frontend/src/App.jsx')
          s = p.read_text()
          s = s.replace(
              '      <p className="grant-summary">\n        {grant.summary || grant.fit_notes || "Review the official notice and GrantForgeUSA preview for program details."}\n      </p>\n',
              '      <p className="grant-summary">\n        {grant.summary || "Review the official notice and GrantForgeUSA preview for program details."}\n      </p>\n      {grant.fit_notes && <p className="fit-explanation"><strong>Why this match:</strong> {grant.fit_notes}</p>}\n'
          )
          s = s.replace(
              '        <div><dt>Level</dt><dd>{grant.level || "Federal"}</dd></div>\n',
              '        <div><dt>Level</dt><dd>{grant.level || "Federal"}</dd></div>\n        <div><dt>Source</dt><dd>{String(grant.source || "").includes("Grants.gov") ? "Live Grants.gov" : "Verified federal data"}</dd></div>\n'
          )
          p.write_text(s)

          p = Path('frontend/grantforge-frontend/src/flow.css')
          s = p.read_text()
          addition = '''\n.fit-explanation {\n  margin: 0.8rem 0;\n  padding: 0.8rem 0.9rem;\n  border-left: 3px solid currentColor;\n  background: rgba(15, 23, 42, 0.04);\n  font-size: 0.92rem;\n  line-height: 1.5;\n}\n.grant-actions button:disabled, .checkout-button:disabled {\n  opacity: 0.55;\n  cursor: not-allowed;\n}\n'''
          if '.fit-explanation {' not in s:
              s += addition
          p.write_text(s)
          PY
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py backend/grantsgov_live.py frontend/grantforge-frontend/src/App.jsx frontend/grantforge-frontend/src/flow.css
          git commit -m "Finish matching and purchase quality hardening"
          git push origin HEAD:main
