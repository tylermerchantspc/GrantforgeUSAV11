name: One-time deployed backend smoke
on:
  push:
    paths:
      - '.github/workflows/one-time-deployed-backend-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify hardened Render backend
        run: |
          set -e
          base='https://grantforgeusa-v11-backend.onrender.com'
          echo 'HEALTH'
          curl -fsS "$base/get/health"
          echo
          echo 'MISSING_STATE'
          code=$(curl -sS -o /tmp/no-state.json -w '%{http_code}' -X POST "$base/questionnaire" -H 'Content-Type: application/json' --data '{"organization":"Smoke Test Org","contactName":"Test User","contactEmail":"test@example.com","category":"501c3 Nonprofit","annualBudget":760000,"amountRequested":125000,"projectTitle":"Rural Youth Apprenticeship Bridge","keywords":"workforce, apprenticeship, rural youth, training","timeline":"18 months","audience":"rural youth","need":"workforce barriers"}')
          cat /tmp/no-state.json
          echo
          test "$code" = '400'
          grep -qi 'state' /tmp/no-state.json
          echo 'WITH_STATE'
          code=$(curl -sS -o /tmp/state.json -w '%{http_code}' -X POST "$base/questionnaire" -H 'Content-Type: application/json' --data '{"organization":"Smoke Test Org","contactName":"Test User","contactEmail":"test@example.com","state":"MN","category":"501c3 Nonprofit","annualBudget":760000,"amountRequested":125000,"projectTitle":"Rural Youth Apprenticeship Bridge","keywords":"workforce, apprenticeship, rural youth, training","timeline":"18 months","audience":"rural youth","need":"workforce barriers"}')
          cat /tmp/state.json
          echo
          test "$code" = '200'
          ! grep -qi 'verified fallback dataset' /tmp/state.json
          ! grep -qi 'appalachian regional commission inspire' /tmp/state.json
