name: One-time public pricing fix

on:
  push:
    paths:
      - '.github/workflows/one-time-public-pricing-fix.yml'

permissions:
  contents: write

jobs:
  patch-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved GrantForgeUSA pricing
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/v11_server.py')
          text = backend.read_text(encoding='utf-8')
          old = '''# Pricing\nFLAT_PRICE = 2500.00'''
          new = '''# Public per-draft pricing\nTEACHER_PRICE = 9.99\nSMALL_ORG_PRICE = 49.99\nMEDIUM_ORG_PRICE = 99.99\nLARGE_ORG_PRICE = 199.99'''
          if old not in text:
              raise SystemExit('Expected legacy pricing constant was not found')
          text = text.replace(old, new, 1)

          old_fn = '''def price_for(category: str, annual_budget: float) -> float:\n    return FLAT_PRICE'''
          new_fn = '''def price_for(category: str, annual_budget: float) -> float:\n    category_key = (category or "").strip().lower()\n    if category_key == "teacher (classroom)":\n        return TEACHER_PRICE\n    if annual_budget <= 500_000:\n        return SMALL_ORG_PRICE\n    if annual_budget <= 2_000_000:\n        return MEDIUM_ORG_PRICE\n    return LARGE_ORG_PRICE'''
          if old_fn not in text:
              raise SystemExit('Expected legacy price_for function was not found')
          backend.write_text(text.replace(old_fn, new_fn, 1), encoding='utf-8')

          app = Path('frontend/grantforge-frontend/src/App.jsx')
          text = app.read_text(encoding='utf-8')
          old = 'const SERVICE_FEE = "$2,500";'
          new = '''const PRICE_RANGE = "$9.99–$199.99";\n\nfunction serviceFeeFor(category, annualBudget) {\n  if (String(category || "").toLowerCase() === "teacher (classroom)") return "$9.99";\n  const budget = Number(annualBudget);\n  if (!Number.isFinite(budget) || budget <= 0) return "Select your organization details";\n  if (budget <= 500000) return "$49.99";\n  if (budget <= 2000000) return "$99.99";\n  return "$199.99";\n}'''
          if old not in text:
              raise SystemExit('Expected frontend legacy fee was not found')
          text = text.replace(old, new, 1)
          text = text.replace('<strong>{SERVICE_FEE}</strong>\n              <p>Current drafting fee per selected opportunity. All sales final; no refunds except where required by law.</p>', '<strong>{PRICE_RANGE}</strong>\n              <p>Teacher: $9.99 · Organizations ≤$500k: $49.99 · $500k–$2M: $99.99 · Over $2M: $199.99. All sales final except where required by law.</p>', 1)
          anchor = '  const [checkingOut, setCheckingOut] = useState(false);'
          if anchor not in text:
              raise SystemExit('LandingPage checkout state anchor was not found')
          text = text.replace(anchor, anchor + '\n  const serviceFee = serviceFeeFor(form.category, form.annualBudget);', 1)
          text = text.replace('<strong>{SERVICE_FEE}</strong>', '<strong>{serviceFee}</strong>', 1)
          text = text.replace('`Purchase full draft · ${SERVICE_FEE}`', '`Purchase full draft · ${serviceFee}`', 1)
          app.write_text(text, encoding='utf-8')

      - name: Verify pricing patch
        run: |
          grep -q 'TEACHER_PRICE = 9.99' backend/v11_server.py
          grep -q 'SMALL_ORG_PRICE = 49.99' backend/v11_server.py
          grep -q 'MEDIUM_ORG_PRICE = 99.99' backend/v11_server.py
          grep -q 'LARGE_ORG_PRICE = 199.99' backend/v11_server.py
          grep -q 'const PRICE_RANGE = "$9.99–$199.99"' frontend/grantforge-frontend/src/App.jsx
      - name: Commit pricing fix
        run: |
          git config user.name 'GrantForgeUSA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/v11_server.py frontend/grantforge-frontend/src/App.jsx
          git commit -m 'Align public checkout with approved pricing tiers'
          git push origin main
