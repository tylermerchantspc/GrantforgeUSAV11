name: One-time pinned validation compatibility fix
on:
  push:
    paths:
      - '.github/workflows/one-time-pinned-compat-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve deterministic test and local shortlist compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/v11_server.py')
          s = p.read_text()
          old = '    short, _ = shortlist(data, pinned_grant=pinned or None)\n'
          new = '    short, _ = shortlist(data, pinned_grant=pinned) if pinned else shortlist(data)\n'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 pinned shortlist calls, found {count}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name "GrantForgeUSA automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/v11_server.py
          git commit -m "Preserve shortlist compatibility during pinned validation"
          git push origin HEAD:main
